# ==============================================================================
# Layer: Database & Persistence Layer Configuration
# Application Properties for Spring Boot & MySQL 8
# ==============================================================================

# Server configuration
server.port=8080

# MySQL DataSource settings
# Note: createDatabaseIfNotExist=true automatically creates the 'contacts' database if it doesn't exist
spring.datasource.url=jdbc:mysql://localhost:3306/contacts?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate settings
# 'update' automatically updates or creates the database schema matching the entity classes without dropping existing data
spring.jpa.hibernate.ddl-auto=update

# Print SQL queries in the console for easy debugging and learning
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson date/time formatting
spring.jackson.serialization.write-dates-as-timestamps=false

